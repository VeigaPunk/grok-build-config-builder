<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Grok Build Config Builder</title>
<style>
/* JetBrains Mono NL Nerd Font — always */
@font-face {
  font-family: "JetBrainsMonoNL Nerd Font Mono";
  src: url("https://cdn.jsdelivr.net/gh/ryanoasis/nerd-fonts@v3.3.0/patched-fonts/JetBrainsMono/NoLigatures/Regular/JetBrainsMonoNLNerdFontMono-Regular.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "JetBrainsMonoNL Nerd Font Mono";
  src: url("https://cdn.jsdelivr.net/gh/ryanoasis/nerd-fonts@v3.3.0/patched-fonts/JetBrainsMono/NoLigatures/Medium/JetBrainsMonoNLNerdFontMono-Medium.ttf") format("truetype");
  font-weight: 500;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "JetBrainsMonoNL Nerd Font Mono";
  src: url("https://cdn.jsdelivr.net/gh/ryanoasis/nerd-fonts@v3.3.0/patched-fonts/JetBrainsMono/NoLigatures/SemiBold/JetBrainsMonoNLNerdFontMono-SemiBold.ttf") format("truetype");
  font-weight: 600;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "JetBrainsMonoNL Nerd Font Mono";
  src: url("https://cdn.jsdelivr.net/gh/ryanoasis/nerd-fonts@v3.3.0/patched-fonts/JetBrainsMono/NoLigatures/Bold/JetBrainsMonoNLNerdFontMono-Bold.ttf") format("truetype");
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}

:root {
  --bg: #0a0a0b;
  --bg-elevated: #121214;
  --bg-subtle: #1a1a1e;
  --fg: #f4f4f5;
  --fg-muted: #a1a1aa;
  --fg-subtle: #71717a;
  --border: color-mix(in oklab, var(--fg) 12%, transparent);
  --border-strong: color-mix(in oklab, var(--fg) 22%, transparent);
  --accent: #c8ccd4;
  --accent-fg: #0a0a0b;
  --success: #6ee7b7;
  --radius-xs: 4px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --font: "JetBrainsMonoNL Nerd Font Mono", "JetBrains Mono NL", ui-monospace, monospace;
  --mono: "JetBrainsMonoNL Nerd Font Mono", "JetBrains Mono NL", ui-monospace, monospace;
  --shadow: 0 8px 30px color-mix(in oklab, #000 35%, transparent);
}

*, *::before, *::after { box-sizing: border-box; border-color: var(--border); }
html { color-scheme: dark; overflow-x: hidden; }
body {
  margin: 0;
  min-height: 100dvh;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  font-variant-ligatures: none;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea, pre, code {
  font-family: inherit;
  font-variant-ligatures: none;
}
button:not(:disabled), [role="button"]:not(:disabled) { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.mono { font-family: var(--mono); }
.panel {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
}
.badge {
  display: inline-flex;
  align-items: center;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--bg-subtle);
  color: var(--fg-muted);
  font-size: 12px;
  font-weight: 500;
  padding: 2px 10px;
}
.badge.success {
  border-color: color-mix(in oklab, var(--success) 30%, transparent);
  background: color-mix(in oklab, var(--success) 10%, transparent);
  color: var(--success);
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 40px;
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  font-size: 13px;
  font-weight: 500;
  transition: opacity 150ms, transform 150ms, border-color 150ms;
  background: var(--accent);
  color: var(--accent-fg);
}
.btn:active { transform: scale(0.98); }
.btn:hover { opacity: 0.9; }
.btn.secondary {
  background: var(--bg-subtle);
  color: var(--fg);
  border-color: var(--border);
}
.btn.secondary:hover { border-color: var(--border-strong); }
.btn.outline {
  background: transparent;
  color: var(--fg);
  border-color: var(--border);
}
.btn.ghost {
  background: transparent;
  color: var(--fg-muted);
}
.btn.sm { min-height: 32px; padding: 4px 12px; font-size: 12px; border-radius: var(--radius-xs); }
.btn.pill {
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  color: var(--fg-muted);
}
.btn.pill.active {
  background: var(--accent);
  color: var(--accent-fg);
  border-color: transparent;
}

header.app {
  position: sticky;
  top: 0;
  z-index: 40;
  border-bottom: 1px solid var(--border);
  background: color-mix(in oklab, var(--bg) 90%, transparent);
  backdrop-filter: blur(12px);
}
.wrap {
  width: 100%;
  max-width: 80rem;
  margin: 0 auto;
  padding: 16px;
  min-width: 0;
}
@media (min-width: 640px) {
  .wrap { padding: 16px 24px; }
}
.eyebrow {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--fg-subtle);
}
h1 {
  margin: 4px 0 0;
  font-size: clamp(1.35rem, 3vw, 1.65rem);
  font-weight: 600;
  letter-spacing: -0.02em;
}
.lede {
  margin: 4px 0 0;
  max-width: 42rem;
  font-size: 13px;
  color: var(--fg-muted);
}
.row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.header-top {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 16px;
  align-items: flex-start;
}
.tabs { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

main.wrap { padding-top: 24px; padding-bottom: 48px; }

.layout {
  display: grid;
  gap: 24px;
  min-width: 0;
}
@media (min-width: 1024px) {
  .layout { grid-template-columns: 240px minmax(0, 1fr); }
}

.sidebar { display: none; min-width: 0; }
@media (min-width: 1024px) {
  .sidebar {
    display: block;
    position: sticky;
    top: 9rem;
    align-self: start;
  }
}
.sidebar .panel, .mobile-strip .panel { padding: 16px; margin-bottom: 16px; }
.sidebar h3, .section-label {
  margin: 0 0 8px;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--fg-subtle);
}
.preset-btn {
  width: 100%;
  text-align: left;
  border: 1px solid var(--border);
  background: var(--bg-subtle);
  color: var(--fg);
  border-radius: var(--radius-md);
  padding: 10px 12px;
  margin-bottom: 8px;
}
.preset-btn:hover { border-color: var(--border-strong); }
.preset-btn strong { display: block; font-size: 13px; }
.preset-btn span { display: block; margin-top: 2px; font-size: 11px; color: var(--fg-muted); }

.mobile-strip { display: block; min-width: 0; }
@media (min-width: 1024px) { .mobile-strip { display: none; } }
.mobile-presets {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: thin;
}
.mobile-presets .btn { flex-shrink: 0; }

.search {
  width: 100%;
  min-height: 40px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg-subtle);
  color: var(--fg);
  padding: 8px 12px 8px 36px;
  font-size: 13px;
}
.search::placeholder { color: var(--fg-subtle); }
.search-wrap { position: relative; margin-bottom: 16px; min-width: 0; }
.search-wrap svg {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  color: var(--fg-subtle);
  pointer-events: none;
}

.group {
  overflow: hidden;
  margin-bottom: 16px;
  min-width: 0;
}
.group-head {
  width: 100%;
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
  padding: 16px 20px;
  background: transparent;
  border: 0;
  color: inherit;
  text-align: left;
}
.group-head:hover { background: color-mix(in oklab, var(--bg-subtle) 40%, transparent); }
.group-head h2 { margin: 0; font-size: 14px; font-weight: 600; }
.group-head p { margin: 2px 0 0; font-size: 12px; color: var(--fg-muted); }
.group-body {
  border-top: 1px solid var(--border);
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.group.collapsed .group-body { display: none; }
.chev { transition: transform 200ms; color: var(--fg-muted); }
.group:not(.collapsed) .chev { transform: rotate(180deg); }

.field {
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 12px 16px;
  min-width: 0;
  transition: background 150ms, opacity 150ms;
}
.field.on { background: var(--bg-elevated); }
.field.off { background: color-mix(in oklab, var(--bg) 40%, transparent); opacity: 0.85; }
.field-row { display: flex; gap: 12px; align-items: flex-start; min-width: 0; }
.field-main { min-width: 0; flex: 1; }
.field-title { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.field-title span { font-size: 13px; font-weight: 500; }
.field-title code {
  font-size: 11px;
  color: var(--fg-subtle);
  word-break: break-all;
}
.field p { margin: 6px 0 0; font-size: 12px; color: var(--fg-muted); }
.field-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.field-meta code {
  font-size: 11px;
  color: var(--fg-subtle);
  background: var(--bg-subtle);
  border-radius: var(--radius-xs);
  padding: 2px 6px;
  word-break: break-all;
}
.field-controls { margin-top: 10px; min-width: 0; }
.field-controls input[type="text"],
.field-controls input[type="number"],
.field-controls select {
  width: 100%;
  max-width: 28rem;
  min-height: 40px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg-subtle);
  color: var(--fg);
  padding: 8px 12px;
  font-size: 13px;
}

.switch {
  position: relative;
  width: 44px;
  height: 24px;
  flex-shrink: 0;
  margin-top: 2px;
}
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch .track {
  position: absolute;
  inset: 0;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--bg-subtle);
  transition: background 150ms;
}
.switch input:checked + .track { background: var(--accent); }
.switch .thumb {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 18px;
  height: 18px;
  border-radius: 999px;
  background: var(--fg-muted);
  transition: transform 150ms, background 150ms;
}
.switch input:checked + .track .thumb {
  transform: translateX(20px);
  background: var(--accent-fg);
}

.preview-grid {
  display: grid;
  gap: 16px;
  min-width: 0;
}
@media (min-width: 1024px) {
  .preview-grid { grid-template-columns: 1fr 1fr; }
}
.preview-panel {
  display: flex;
  flex-direction: column;
  min-height: 320px;
  min-width: 0;
  overflow: hidden;
}
.preview-panel header {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 8px;
  align-items: center;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  background: transparent;
}
.preview-panel header strong { font-size: 13px; }
.preview-panel header p { margin: 0; font-size: 11px; color: var(--fg-muted); }
.preview-panel pre {
  flex: 1;
  margin: 0;
  padding: 16px;
  overflow: auto;
  background: var(--bg);
  color: var(--fg-muted);
  font-size: 12px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-all;
  scrollbar-width: thin;
}

.ref-article { padding: 16px; min-width: 0; }
@media (min-width: 640px) { .ref-article { padding: 32px; } }
.ref-article h2 { margin: 0 0 12px; font-size: 16px; font-weight: 600; }
.ref-article section { margin-bottom: 32px; }
.ref-article pre {
  overflow-x: auto;
  background: var(--bg);
  border-radius: var(--radius-md);
  padding: 16px;
  font-size: 13px;
  color: var(--fg-muted);
}
.ref-article table {
  width: 100%;
  min-width: 480px;
  border-collapse: collapse;
  font-size: 13px;
  text-align: left;
}
.ref-article th {
  padding: 8px 16px 8px 0;
  font-weight: 500;
  color: var(--fg-muted);
  border-bottom: 1px solid var(--border);
}
.ref-article td {
  padding: 8px 16px 8px 0;
  color: var(--fg-muted);
  border-bottom: 1px solid color-mix(in oklab, var(--border) 60%, transparent);
  vertical-align: top;
}
.table-scroll { overflow-x: auto; }

footer.app {
  border-top: 1px solid var(--border);
  padding: 32px 16px;
  text-align: center;
  font-size: 11px;
  color: var(--fg-subtle);
}

.sticky-bar {
  position: sticky;
  bottom: 16px;
  z-index: 30;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px;
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  background: color-mix(in oklab, var(--bg-elevated) 95%, transparent);
  box-shadow: var(--shadow);
  backdrop-filter: blur(8px);
}
@media (min-width: 1024px) { .sticky-bar { display: none; } }
.sticky-bar .btn { flex: 1; min-height: 44px; }

.hidden { display: none !important; }
.ml-auto { margin-left: auto; }
@media (max-width: 639px) {
  .hide-sm { display: none !important; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

</style>
</head>
<body>
<div id="app"><div class="wrap" style="padding:48px;color:var(--fg-muted)">Loading schema…</div></div>
<script>
(() => {
  const state = { schema: null, enabled: new Set(), values: {}, tab: "builder", query: "", activeGroup: "all", collapsed: new Set() };
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const esc = (s) => { const e = (n) => String.fromCharCode(38) + n + ";"; return String(s).replace(/&/g, e("amp")).replace(/</g, e("lt")).replace(/>/g, e("gt")).replace(/"/g, e("quot")); };
  const toast = (msg) => { let t = $("#toast"); if (!t) { t = document.createElement("div"); t.id = "toast"; Object.assign(t.style, { position: "fixed", bottom: "24px", right: "24px", zIndex: "100", padding: "10px 14px", borderRadius: "8px", background: "#1a1a1e", color: "#f4f4f5", fontSize: "13px", fontFamily: "inherit" }); document.body.appendChild(t); } t.textContent = msg; t.style.opacity = "1"; clearTimeout(t._tm); t._tm = setTimeout(() => { t.style.opacity = "0"; }, 1400); };
  const dl = (name, content, mime) => { const b = new Blob([content], { type: mime }); const u = URL.createObjectURL(b); const a = document.createElement("a"); a.href = u; a.download = name; a.click(); URL.revokeObjectURL(u); };
  
function formatValue(field, value) {
  if (value == null || value === "") return null;
  if (field.type === "boolean") return value ? "true" : "false";
  if (field.type === "number") {
    const n = Number(value);
    if (Number.isNaN(n)) return null;
    return Number.isInteger(n) ? String(n) : String(n);
  }
  if (field.type === "string-list") {
    const list = Array.isArray(value) ? value : String(value).split(",").map(s => s.trim()).filter(Boolean);
    if (!list.length) return null;
    return "[" + list.map(s => JSON.stringify(s)).join(", ") + "]";
  }
  return JSON.stringify(String(value));
}
function resolveKey(field, values) {
  if (field.id.startsWith("model.custom.")) {
    if (field.id === "model.custom.id") return null;
    const modelId = values["model.custom.id"] || "grok-4.5";
    const key = field.id.replace("model.custom.", "");
    return { section: 'model."' + modelId + '"', key };
  }
  if (field.path.startsWith("permissions.")) {
    const key = field.path.slice("permissions.".length);
    if (key === "remember_tool_approvals" || key === "default_selected_permission") return { section: "ui", key };
    return { section: "permissions", key };
  }
  if (field.path.startsWith("features.")) return { section: "features", key: field.path.slice("features.".length) };
  if (field.path.startsWith("tools.")) return { section: "tools", key: field.path.slice("tools.".length) };
  const parts = field.path.split(".");
  if (parts.length === 2) return { section: parts[0], key: parts[1] };
  if (parts.length === 3) return { section: parts[0] + "." + parts[1], key: parts[2] };
  return { section: field.section, key: parts[parts.length - 1] };
}
function generateToml(enabled, values, fields) {
  const en = new Set(enabled);
  const sections = {};
  for (const field of fields) {
    if (!en.has(field.id)) continue;
    const formatted = formatValue(field, values[field.id]);
    if (formatted == null) continue;
    const rk = resolveKey(field, values);
    if (!rk) continue;
    (sections[rk.section] ||= []).push(rk.key + " = " + formatted);
  }
  const order = ["models","sandbox","permissions","session","cli","hints","ui","tools","features","harness","telemetry","auth","auth.oidc","grok_com_config","plugins"];
  let body = "";
  const seen = new Set();
  for (const sec of order) {
    if (!sections[sec]) continue;
    seen.add(sec);
    body += "[" + sec + "]\n" + sections[sec].join("\n") + "\n\n";
  }
  for (const [sec, lines] of Object.entries(sections)) {
    if (seen.has(sec)) continue;
    body += "[" + sec + "]\n" + lines.join("\n") + "\n\n";
  }
  const now = new Date().toISOString();
  return "# Grok Build config patch\n# Generated by Grok Build Config Builder\n# Merge into ~/.grok/config.toml\n# Generated: " + now + "\n\n" + (body || "# (no settings enabled)\n");
}
function generateEnv(enabled, values, fields) {
  const en = new Set(enabled);
  const now = new Date().toISOString();
  const lines = ["# Environment overrides for Grok Build", "# Generated: " + now, ""];
  let count = 0;
  for (const field of fields) {
    if (!en.has(field.id) || !field.env) continue;
    const raw = values[field.id];
    if (raw == null || raw === "") continue;
    if (field.env === "GROK_DISABLE_AUTOUPDATER") {
      if (raw === false) { lines.push("export GROK_DISABLE_AUTOUPDATER=1"); count++; }
      continue;
    }
    let val;
    if (typeof raw === "boolean") val = raw ? "1" : "0";
    else val = String(raw);
    lines.push("export " + field.env + "=" + JSON.stringify(val));
    count++;
  }
  if (!count) lines.push("# (no env-mapped settings enabled)");
  lines.push("");
  return lines.join("\n");
}
function generateCli(enabled, values) {
  const en = new Set(enabled);
  const parts = ["grok"];
  if (en.has("models.default") && values["models.default"]) parts.push("-m " + values["models.default"]);
  if (en.has("models.default_reasoning_effort") && values["models.default_reasoning_effort"]) parts.push("--effort " + values["models.default_reasoning_effort"]);
  if (en.has("sandbox.profile") && values["sandbox.profile"]) parts.push("--sandbox " + values["sandbox.profile"]);
  if (en.has("permissions.permission_mode") && values["permissions.permission_mode"] === "always-approve") parts.push("--always-approve");
  if (en.has("features.memory")) parts.push(values["features.memory"] ? "--experimental-memory" : "--no-memory");
  if (en.has("features.subagents") && values["features.subagents"] === false) parts.push("--no-subagents");
  if (en.has("cli.auto_update") && values["cli.auto_update"] === false) parts.push("--no-auto-update");
  const joined = parts.join(" ");
  const now = new Date().toISOString();
  return "# Example launch flags\n# Generated: " + now + "\n\n" + joined + "\n\n# Headless:\n" + joined + " -p \"your prompt\" --output-format streaming-json\n";
}
function generateMarkdown(schema) {
  let md = "# Grok Build CLI — Complete Config Reference\n\n";
  md += "> Generated by Grok Build Config Builder.\n\n## Install\n\n```bash\ncurl -fsSL https://x.ai/cli/install.sh | bash\ngrok version\n```\n\n";
  md += "## Subcommands\n\n| Command | Description |\n| --- | --- |\n";
  for (const s of schema.subcommands) md += "| `" + s.cmd + "` | " + s.desc + " |\n";
  md += "\n## Launch flags\n\n| Flag | Category | Description |\n| --- | --- | --- |\n";
  for (const f of schema.cliFlags) md += "| `" + f.flag + "` | " + f.category + " | " + f.description + " |\n";
  md += "\n## Environment variables\n\n| Variable | Category | Description |\n| --- | --- | --- |\n";
  for (const e of schema.envVars) md += "| `" + e.name + "` | " + e.category + " | " + e.description + " |\n";
  md += "\n## config.toml keys\n\n";
  for (const g of schema.groups) {
    md += "### " + g.title + "\n\n" + g.description + "\n\n| Key | Type | Description |\n| --- | --- | --- |\n";
    for (const f of schema.fields.filter(x => x.group === g.id)) {
      md += "| `" + f.path + "` | " + f.type + " | " + f.description + " |\n";
    }
    md += "\n";
  }
  return md;
}
async function genClient(enabled, values, schema) {
  return {

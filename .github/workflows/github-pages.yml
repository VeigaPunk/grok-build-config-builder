name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build static Pages site
        run: npm run build:pages

      - name: Fix SPA entry name for Pages
        run: |
          # Vite emits pages.html; GitHub Pages needs index.html at site root
          if [ -f dist-pages/pages.html ]; then
            mv dist-pages/pages.html dist-pages/index.html
          fi
          # SPA fallback for client routes
          cp dist-pages/index.html dist-pages/404.html
          # Copy markdown docs into site
          mkdir -p dist-pages/docs
          cp -r public/docs/* dist-pages/docs/ 2>/dev/null || true
          cp grok-build-cli-config-reference.md dist-pages/docs/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

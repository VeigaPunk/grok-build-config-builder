name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare multi-product static site
        run: |
          # pages-multi is the source of truth for static multi-product builders
          if [ ! -d pages-multi ]; then
            echo "pages-multi missing" >&2
            exit 1
          fi
          rm -rf dist-pages
          mkdir -p dist-pages
          cp -a pages-multi/. dist-pages/
          # SPA-ish 404 fallback to hub
          cp dist-pages/index.html dist-pages/404.html
          # docs
          mkdir -p dist-pages/docs
          if [ -f grok-build-cli-config-reference.md ]; then
            cp grok-build-cli-config-reference.md dist-pages/docs/
          fi
          find dist-pages -type f | head -40

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist-pages
          force_orphan: true

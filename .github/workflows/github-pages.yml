name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build static Pages site
        run: npm run build:pages

      - name: Prepare publish folder
        run: |
          if [ -f dist-pages/pages.html ]; then
            mv dist-pages/pages.html dist-pages/index.html
          fi
          cp dist-pages/index.html dist-pages/404.html
          mkdir -p dist-pages/docs

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist-pages
          force_orphan: true

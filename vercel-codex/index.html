<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>codex Titanium Config Builder</title>
<style>
/* JetBrains Mono NL Nerd Font — always */
@font-face {
  font-family: "JetBrainsMonoNL Nerd Font Mono";
  src: url("https://cdn.jsdelivr.net/gh/ryanoasis/nerd-fonts@v3.3.0/patched-fonts/JetBrainsMono/NoLigatures/Regular/JetBrainsMonoNLNerdFontMono-Regular.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "JetBrainsMonoNL Nerd Font Mono";
  src: url("https://cdn.jsdelivr.net/gh/ryanoasis/nerd-fonts@v3.3.0/patched-fonts/JetBrainsMono/NoLigatures/Medium/JetBrainsMonoNLNerdFontMono-Medium.ttf") format("truetype");
  font-weight: 500;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "JetBrainsMonoNL Nerd Font Mono";
  src: url("https://cdn.jsdelivr.net/gh/ryanoasis/nerd-fonts@v3.3.0/patched-fonts/JetBrainsMono/NoLigatures/SemiBold/JetBrainsMonoNLNerdFontMono-SemiBold.ttf") format("truetype");
  font-weight: 600;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "JetBrainsMonoNL Nerd Font Mono";
  src: url("https://cdn.jsdelivr.net/gh/ryanoasis/nerd-fonts@v3.3.0/patched-fonts/JetBrainsMono/NoLigatures/Bold/JetBrainsMonoNLNerdFontMono-Bold.ttf") format("truetype");
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}

:root {
  --bg: #0a0a0b;
  --bg-elevated: #121214;
  --bg-subtle: #1a1a1e;
  --fg: #f4f4f5;
  --fg-muted: #a1a1aa;
  --fg-subtle: #71717a;
  --border: color-mix(in oklab, var(--fg) 12%, transparent);
  --border-strong: color-mix(in oklab, var(--fg) 22%, transparent);
  --accent: #c8ccd4;
  --accent-fg: #0a0a0b;
  --success: #6ee7b7;
  --radius-xs: 4px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --font: "JetBrainsMonoNL Nerd Font Mono", "JetBrains Mono NL", ui-monospace, monospace;
  --mono: "JetBrainsMonoNL Nerd Font Mono", "JetBrains Mono NL", ui-monospace, monospace;
  --shadow: 0 8px 30px color-mix(in oklab, #000 35%, transparent);
}

*, *::before, *::after { box-sizing: border-box; border-color: var(--border); }
html { color-scheme: dark; overflow-x: hidden; }
body {
  margin: 0;
  min-height: 100dvh;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  font-variant-ligatures: none;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea, pre, code {
  font-family: inherit;
  font-variant-ligatures: none;
}
button:not(:disabled), [role="button"]:not(:disabled) { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.mono { font-family: var(--mono); }
.panel {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
}
.badge {
  display: inline-flex;
  align-items: center;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--bg-subtle);
  color: var(--fg-muted);
  font-size: 12px;
  font-weight: 500;
  padding: 2px 10px;
}
.badge.success {
  border-color: color-mix(in oklab, var(--success) 30%, transparent);
  background: color-mix(in oklab, var(--success) 10%, transparent);
  color: var(--success);
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 40px;
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  font-size: 13px;
  font-weight: 500;
  transition: opacity 150ms, transform 150ms, border-color 150ms;
  background: var(--accent);
  color: var(--accent-fg);
}
.btn:active { transform: scale(0.98); }
.btn:hover { opacity: 0.9; }
.btn.secondary {
  background: var(--bg-subtle);
  color: var(--fg);
  border-color: var(--border);
}
.btn.secondary:hover { border-color: var(--border-strong); }
.btn.outline {
  background: transparent;
  color: var(--fg);
  border-color: var(--border);
}
.btn.ghost {
  background: transparent;
  color: var(--fg-muted);
}
.btn.sm { min-height: 32px; padding: 4px 12px; font-size: 12px; border-radius: var(--radius-xs); }
.btn.pill {
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  color: var(--fg-muted);
}
.btn.pill.active {
  background: var(--accent);
  color: var(--accent-fg);
  border-color: transparent;
}

header.app {
  position: sticky;
  top: 0;
  z-index: 40;
  border-bottom: 1px solid var(--border);
  background: color-mix(in oklab, var(--bg) 90%, transparent);
  backdrop-filter: blur(12px);
}
.wrap {
  width: 100%;
  max-width: 80rem;
  margin: 0 auto;
  padding: 16px;
  min-width: 0;
}
@media (min-width: 640px) {
  .wrap { padding: 16px 24px; }
}
.eyebrow {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--fg-subtle);
}
h1 {
  margin: 4px 0 0;
  font-size: clamp(1.35rem, 3vw, 1.65rem);
  font-weight: 600;
  letter-spacing: -0.02em;
}
.lede {
  margin: 4px 0 0;
  max-width: 42rem;
  font-size: 13px;
  color: var(--fg-muted);
}
.row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.header-top {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 16px;
  align-items: flex-start;
}
.tabs { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

main.wrap { padding-top: 24px; padding-bottom: 48px; }

.layout {
  display: grid;
  gap: 24px;
  min-width: 0;
}
@media (min-width: 1024px) {
  .layout { grid-template-columns: 240px minmax(0, 1fr); }
}

.sidebar { display: none; min-width: 0; }
@media (min-width: 1024px) {
  .sidebar {
    display: block;
    position: sticky;
    top: 9rem;
    align-self: start;
  }
}
.sidebar .panel, .mobile-strip .panel { padding: 16px; margin-bottom: 16px; }
.sidebar h3, .section-label {
  margin: 0 0 8px;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--fg-subtle);
}
.preset-btn {
  width: 100%;
  text-align: left;
  border: 1px solid var(--border);
  background: var(--bg-subtle);
  color: var(--fg);
  border-radius: var(--radius-md);
  padding: 10px 12px;
  margin-bottom: 8px;
}
.preset-btn:hover { border-color: var(--border-strong); }
.preset-btn strong { display: block; font-size: 13px; }
.preset-btn span { display: block; margin-top: 2px; font-size: 11px; color: var(--fg-muted); }

.mobile-strip { display: block; min-width: 0; }
@media (min-width: 1024px) { .mobile-strip { display: none; } }
.mobile-presets {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: thin;
}
.mobile-presets .btn { flex-shrink: 0; }

.search {
  width: 100%;
  min-height: 40px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg-subtle);
  color: var(--fg);
  padding: 8px 12px 8px 36px;
  font-size: 13px;
}
.search::placeholder { color: var(--fg-subtle); }
.search-wrap { position: relative; margin-bottom: 16px; min-width: 0; }
.search-wrap svg {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  color: var(--fg-subtle);
  pointer-events: none;
}

.group {
  overflow: hidden;
  margin-bottom: 16px;
  min-width: 0;
}
.group-head {
  width: 100%;
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
  padding: 16px 20px;
  background: transparent;
  border: 0;
  color: inherit;
  text-align: left;
}
.group-head:hover { background: color-mix(in oklab, var(--bg-subtle) 40%, transparent); }
.group-head h2 { margin: 0; font-size: 14px; font-weight: 600; }
.group-head p { margin: 2px 0 0; font-size: 12px; color: var(--fg-muted); }
.group-body {
  border-top: 1px solid var(--border);
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.group.collapsed .group-body { display: none; }
.chev { transition: transform 200ms; color: var(--fg-muted); }
.group:not(.collapsed) .chev { transform: rotate(180deg); }

.field {
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 12px 16px;
  min-width: 0;
  transition: background 150ms, opacity 150ms;
}
.field.on { background: var(--bg-elevated); }
.field.off { background: color-mix(in oklab, var(--bg) 40%, transparent); opacity: 0.85; }
.field-row { display: flex; gap: 12px; align-items: flex-start; min-width: 0; }
.field-main { min-width: 0; flex: 1; }
.field-title { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.field-title span { font-size: 13px; font-weight: 500; }
.field-title code {
  font-size: 11px;
  color: var(--fg-subtle);
  word-break: break-all;
}
.field p { margin: 6px 0 0; font-size: 12px; color: var(--fg-muted); }
.field-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.field-meta code {
  font-size: 11px;
  color: var(--fg-subtle);
  background: var(--bg-subtle);
  border-radius: var(--radius-xs);
  padding: 2px 6px;
  word-break: break-all;
}
.field-controls { margin-top: 10px; min-width: 0; }
.field-controls input[type="text"],
.field-controls input[type="number"],
.field-controls select {
  width: 100%;
  max-width: 28rem;
  min-height: 40px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg-subtle);
  color: var(--fg);
  padding: 8px 12px;
  font-size: 13px;
}

.switch {
  position: relative;
  width: 44px;
  height: 24px;
  flex-shrink: 0;
  margin-top: 2px;
}
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch .track {
  position: absolute;
  inset: 0;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--bg-subtle);
  transition: background 150ms;
}
.switch input:checked + .track { background: var(--accent); }
.switch .thumb {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 18px;
  height: 18px;
  border-radius: 999px;
  background: var(--fg-muted);
  transition: transform 150ms, background 150ms;
}
.switch input:checked + .track .thumb {
  transform: translateX(20px);
  background: var(--accent-fg);
}

.preview-grid {
  display: grid;
  gap: 16px;
  min-width: 0;
}
@media (min-width: 1024px) {
  .preview-grid { grid-template-columns: 1fr 1fr; }
}
.preview-panel {
  display: flex;
  flex-direction: column;
  min-height: 320px;
  min-width: 0;
  overflow: hidden;
}
.preview-panel header {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 8px;
  align-items: center;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  background: transparent;
}
.preview-panel header strong { font-size: 13px; }
.preview-panel header p { margin: 0; font-size: 11px; color: var(--fg-muted); }
.preview-panel pre {
  flex: 1;
  margin: 0;
  padding: 16px;
  overflow: auto;
  background: var(--bg);
  color: var(--fg-muted);
  font-size: 12px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-all;
  scrollbar-width: thin;
}

.ref-article { padding: 16px; min-width: 0; }
@media (min-width: 640px) { .ref-article { padding: 32px; } }
.ref-article h2 { margin: 0 0 12px; font-size: 16px; font-weight: 600; }
.ref-article section { margin-bottom: 32px; }
.ref-article pre {
  overflow-x: auto;
  background: var(--bg);
  border-radius: var(--radius-md);
  padding: 16px;
  font-size: 13px;
  color: var(--fg-muted);
}
.ref-article table {
  width: 100%;
  min-width: 480px;
  border-collapse: collapse;
  font-size: 13px;
  text-align: left;
}
.ref-article th {
  padding: 8px 16px 8px 0;
  font-weight: 500;
  color: var(--fg-muted);
  border-bottom: 1px solid var(--border);
}
.ref-article td {
  padding: 8px 16px 8px 0;
  color: var(--fg-muted);
  border-bottom: 1px solid color-mix(in oklab, var(--border) 60%, transparent);
  vertical-align: top;
}
.table-scroll { overflow-x: auto; }

footer.app {
  border-top: 1px solid var(--border);
  padding: 32px 16px;
  text-align: center;
  font-size: 11px;
  color: var(--fg-subtle);
}

.sticky-bar {
  position: sticky;
  bottom: 16px;
  z-index: 30;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px;
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  background: color-mix(in oklab, var(--bg-elevated) 95%, transparent);
  box-shadow: var(--shadow);
  backdrop-filter: blur(8px);
}
@media (min-width: 1024px) { .sticky-bar { display: none; } }
.sticky-bar .btn { flex: 1; min-height: 44px; }

.hidden { display: none !important; }
.ml-auto { margin-left: auto; }
@media (max-width: 639px) {
  .hide-sm { display: none !important; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

</style>

      if (i === 0 && !content && window.__gen) content = window.__gen.config || "";

      if (btns[0]) btns[0].addEventListener("click", async () => { try { await navigator.clipboard.writeText(content); toast("Copied"); } catch { toast("Copy failed"); } });
      if (btns[1]) btns[1].addEventListener("click", () => dl(files[i][0], content, files[i][1]));
    });
  }
  (async () => {
    state.schema = window.__STATIC_SCHEMA__;
    if (state.schema.cli_flags) state.schema.cliFlags = state.schema.cli_flags;
    if (state.schema.env_vars) state.schema.envVars = state.schema.env_vars;
    if (state.schema.cliFlags === undefined && state.schema.cli_flags) state.schema.cliFlags = state.schema.cli_flags;
    // serde may already camelCase
    state.enabled = new Set(state.schema.presets[0].enabled);
    state.values = defaults();
    await render();
  })().catch((e) => {

  });
})();
